---
- name: Create local report output directory
  ansible.builtin.file:
    path: "{{ audit_output_dir }}"
    state: directory
    mode: "0750"

- name: Write individual JSON report for each audited host
  ansible.builtin.copy:
    content: "{{ hostvars[item].php_audit | to_nice_json }}\n"
    dest: "{{ audit_output_dir }}/{{ item | regex_replace('[^A-Za-z0-9_.-]', '_') }}.json"
    mode: "0640"
  loop: "{{ groups['all'] }}"
  loop_control:
    label: "{{ item }}"
  when: hostvars[item].php_audit is defined

- name: Check for previous per-host JSON reports
  ansible.builtin.stat:
    path: "{{ audit_output_dir }}/{{ item | regex_replace('[^A-Za-z0-9_.-]', '_') }}.json"
    get_checksum: false
  register: audit_previous_json_stats
  loop: "{{ groups['all'] }}"
  loop_control:
    label: "{{ item }}"
  when: audit_use_previous_results | bool

- name: Initialize consolidated host audit data
  ansible.builtin.set_fact:
    audit_report_hosts: []

- name: Add current scan results to consolidated data
  ansible.builtin.set_fact:
    audit_report_hosts: "{{ audit_report_hosts + [hostvars[item].php_audit | combine({'audit_data_source': 'scansione corrente', 'audit_data_timestamp': (hostvars[item].php_audit.audit_timestamp | default('unknown'))})] }}"
  loop: "{{ groups['all'] }}"
  loop_control:
    label: "{{ item }}"
  when: hostvars[item].php_audit is defined

- name: Add previous results for hosts missing from the current scan
  ansible.builtin.set_fact:
    audit_report_hosts: "{{ audit_report_hosts + [(lookup('file', item.stat.path) | from_json | combine({'audit_data_source': 'scansione precedente', 'audit_data_timestamp': ('%Y-%m-%d %H:%M:%S' | strftime(item.stat.mtime | int))}))] }}"
  loop: "{{ audit_previous_json_stats.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - audit_use_previous_results | bool
    - item.stat.exists | default(false)
    - hostvars[item.item].php_audit is not defined

- name: Generate consolidated CSV report
  ansible.builtin.template:
    src: templates/report.csv.j2
    dest: "{{ audit_output_dir }}/php_security_audit.csv"
    mode: "0640"

- name: Generate consolidated HTML report
  ansible.builtin.template:
    src: templates/report.html.j2
    dest: "{{ audit_output_dir }}/php_security_audit.html"
    mode: "0640"

- name: Check wkhtmltopdf availability on the controller
  ansible.builtin.command: wkhtmltopdf --version
  register: audit_wkhtmltopdf
  changed_when: false
  failed_when: false
  when: audit_generate_pdf | bool

- name: Require wkhtmltopdf when PDF generation is enabled
  ansible.builtin.assert:
    that:
      - audit_wkhtmltopdf.rc == 0
    fail_msg: "PDF generation is enabled, but wkhtmltopdf is not installed or not available on the Ansible controller."
  when: audit_generate_pdf | bool

- name: Convert consolidated HTML report to PDF
  ansible.builtin.command:
    argv:
      - wkhtmltopdf
      - --enable-local-file-access
      - --encoding
      - UTF-8
      - --quiet
      - "{{ audit_output_dir }}/php_security_audit.html"
      - "{{ audit_output_dir }}/php_security_audit.pdf"
  register: audit_pdf_conversion
  changed_when: audit_pdf_conversion.rc == 0
  failed_when: audit_pdf_conversion.rc != 0
  when: audit_generate_pdf | bool