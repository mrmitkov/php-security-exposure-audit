- name: List LXD containers and their states
  ansible.builtin.command:
    argv:
      - lxc
      - list
      - --format
      - csv
      - --columns
      - ns
  register: audit_lxd_containers
  changed_when: false
  failed_when: false
  when: audit_scan_lxc_containers | bool

- name: Probe PHP inside each running LXD container
  ansible.builtin.command:
