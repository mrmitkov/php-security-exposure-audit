  loop: "{{ audit_lxd_containers.stdout_lines | default([]) }}"
  loop_control:
    label: "{{ item.split(',')[0] }}"
  when:
    - audit_scan_lxc_containers | bool
    - audit_lxd_containers.rc | default(1) == 0
