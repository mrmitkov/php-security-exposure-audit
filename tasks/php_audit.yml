---
- name: Locate the PHP CLI executable
  ansible.builtin.shell: command -v php
  args:
    executable: /bin/sh
  register: audit_php_binary
  changed_when: false
  failed_when: false

- name: Read PHP CLI version
  ansible.builtin.command: php -v
  register: audit_php_version
  changed_when: false
  failed_when: false
  when: audit_php_binary.rc == 0

- name: Read upload progress setting from PHP CLI
  ansible.builtin.command:
    argv:
      - php
      - -r
      - '$v = ini_get("session.upload_progress.enabled"); if ($v === false) { echo "UNKNOWN"; } else { echo in_array(strtolower((string) $v), array("1", "on", "yes", "true"), true) ? "ON" : "OFF"; }'
  register: audit_upload_progress
  changed_when: false
  failed_when: false
  when: audit_php_binary.rc == 0

- name: Discover PHP CGI and FPM executables
  ansible.builtin.shell: |
    for candidate in php-cgi php-fpm php-fpm8.5 php-fpm8.4 php-fpm8.3 php-fpm8.2 php-fpm8.1 php-fpm8.0 php-fpm7.4 php-fpm7.3 php-fpm7.2 php-fpm7.1 php-fpm7.0 php-fpm5.6; do
      command -v "$candidate" 2>/dev/null || true
    done
  args:
    executable: /bin/sh
  register: audit_php_sapi_binaries
  changed_when: false
  failed_when: false

- name: Read PHP version from CGI or FPM when the CLI is absent
  ansible.builtin.command:
    argv:
      - "{{ audit_php_sapi_binaries.stdout_lines | first }}"
      - -v
  register: audit_php_sapi_version
  changed_when: false
  failed_when: false
  when:
    - audit_php_binary.rc != 0
    - audit_php_sapi_binaries.stdout_lines | default([]) | length > 0

- name: Discover installed PHP and web application packages
  ansible.builtin.shell: |
    if command -v rpm >/dev/null 2>&1; then
      packages=$(rpm -qa --qf '%{NAME}\n' 2>/dev/null) || exit 1
    elif command -v dpkg-query >/dev/null 2>&1; then
      packages=$(dpkg-query -W -f='${binary:Package}\n' 2>/dev/null) || exit 1
    else
      printf 'Neither rpm nor dpkg-query is available\n' >&2
      exit 127
    fi
    printf '%s\n' "$packages" | awk 'tolower($0) ~ /^(php|libphp|apache2|httpd|nginx|tomcat|websphere)/'
  args:
    executable: /bin/sh
  register: audit_packages
  changed_when: false
  failed_when: false

- name: Gather service facts
  ansible.builtin.service_facts:
  register: audit_service_facts
  changed_when: false

- name: Normalize discovered service names and running states
  ansible.builtin.set_fact:
    audit_service_names: "{{ audit_service_facts.ansible_facts.services | default({}) | dict2items | map(attribute='key') | list }}"
    audit_running_service_names: "{{ audit_service_facts.ansible_facts.services | default({}) | dict2items | selectattr('value.state', 'equalto', 'running') | map(attribute='key') | list }}"

- name: Discover installed Tomcat paths
  ansible.builtin.shell: |
    for path in /opt/tomcat /usr/local/tomcat /usr/share/tomcat /var/lib/tomcat /opt/apache-tomcat*; do
      if [ -e "$path" ]; then
        printf '%s\n' "$path"
      fi
    done
  args:
    executable: /bin/sh
  register: audit_tomcat_paths
  changed_when: false
  failed_when: false

- name: Discover Apache and Nginx executables
  ansible.builtin.shell: |
    for executable in apache2 httpd apachectl apache2ctl nginx; do
      command -v "$executable" 2>/dev/null || true
    done
  args:
    executable: /bin/sh
  register: audit_web_server_binaries
  changed_when: false
  failed_when: false

- name: Discover active web server processes
  ansible.builtin.shell: |
    ps -eo args= 2>/dev/null | awk '
      /[n]ginx: master process/ { print "active:nginx" }
      /[h]ttpd|[a]pache2/ { print "active:apache" }
      /[o]rg\.apache\.catalina\.startup\.Bootstrap|[o]rg\.apache\.catalina\.startup\.Tomcat/ { print "active:tomcat" }
      /[c]om\.ibm\.ws\.runtime\.WsServer|[c]om\.ibm\.ws\.kernel\.boot\.Launcher/ { print "active:websphere" }
    ' | sort -u
  args:
    executable: /bin/sh
  register: audit_process_probe
  changed_when: false
  failed_when: false

- name: Discover IBM WebSphere installation paths
  ansible.builtin.shell: |
    for path in /opt/IBM/WebSphere /usr/IBM/WebSphere /usr/local/IBM/WebSphere /opt/IBM/HTTPServer; do
      if [ -e "$path" ]; then
        printf '%s\n' "$path"
      fi
    done
  args:
    executable: /bin/sh
  register: audit_websphere_paths
  changed_when: false
  failed_when: false

- name: Discover listening TCP web ports
  ansible.builtin.shell: |
    if command -v ss >/dev/null 2>&1; then
      ss -ltnH 2>/dev/null | awk '{print $4}'
    elif command -v netstat >/dev/null 2>&1; then
      netstat -lnt 2>/dev/null | awk 'NR > 2 {print $4}'
    fi | awk -F: '$NF == "80" || $NF == "443" || $NF == "8080" || $NF == "8443" {print $NF}' | sort -u
  args:
    executable: /bin/sh
  register: audit_listening_ports
  changed_when: false
  failed_when: false

- name: Count PHP application files in configured scan roots
  ansible.builtin.shell: |
    find {{ audit_php_scan_roots | map('quote') | join(' ') }} -type f -iname '*.php' -printf '.' 2>/dev/null | wc -c
  args:
    executable: /bin/sh
  register: audit_php_file_count
  changed_when: false
  failed_when: false

- name: Find directories containing PHP files
  ansible.builtin.shell: |
    find {{ audit_php_scan_roots | map('quote') | join(' ') }} -type f -iname '*.php' -printf '%h\n' 2>/dev/null | sort -u
  args:
    executable: /bin/sh
  register: audit_php_directories
  changed_when: false
  failed_when: false

- name: Count WAR deployment archives
  ansible.builtin.shell: |
    find {{ audit_war_scan_roots | map('quote') | join(' ') }} -type f -iname '*.war' -printf '.' 2>/dev/null | wc -c
  args:
    executable: /bin/sh
  register: audit_war_count
  changed_when: false
  failed_when: false

- name: Find WAR deployment directories
  ansible.builtin.shell: |
    find {{ audit_war_scan_roots | map('quote') | join(' ') }} -type f -iname '*.war' -printf '%h\n' 2>/dev/null | sort -u
  args:
    executable: /bin/sh
  register: audit_war_directories
  changed_when: false
  failed_when: false

- name: Find existing document roots
  ansible.builtin.shell: |
    for path in {{ audit_document_roots | map('quote') | join(' ') }}; do
      if [ -d "$path" ]; then
        printf '%s\n' "$path"
      fi
    done
  args:
    executable: /bin/sh
  register: audit_document_roots_found
  changed_when: false
  failed_when: false

- name: List running Docker containers
  ansible.builtin.command: docker ps --quiet
  register: audit_docker_containers
  changed_when: false
  failed_when: false
  when: audit_scan_docker_containers | bool

- name: Probe PHP inside each running Docker container
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ item }}"
      - sh
      - -c
      - >-
        if command -v php >/dev/null 2>&1; then
          printf 'PHP_PRESENT=1\n';
          php -v 2>/dev/null | head -n 1;
          setting=$(php -r '$v = ini_get("session.upload_progress.enabled"); if ($v === false) { echo "UNKNOWN"; } else { echo in_array(strtolower((string) $v), array("1", "on", "yes", "true"), true) ? "ON" : "OFF"; }' 2>/dev/null) || setting=UNKNOWN;
          printf 'UPLOAD_PROGRESS=%s\n' "$setting";
        elif command -v php-cgi >/dev/null 2>&1 || command -v php-fpm >/dev/null 2>&1 || command -v php-fpm8.5 >/dev/null 2>&1 || command -v php-fpm8.4 >/dev/null 2>&1 || command -v php-fpm8.3 >/dev/null 2>&1 || command -v php-fpm8.2 >/dev/null 2>&1 || command -v php-fpm8.1 >/dev/null 2>&1 || command -v php-fpm8.0 >/dev/null 2>&1 || command -v php-fpm7.4 >/dev/null 2>&1 || command -v php-fpm7.3 >/dev/null 2>&1 || command -v php-fpm7.2 >/dev/null 2>&1 || command -v php-fpm7.1 >/dev/null 2>&1 || command -v php-fpm7.0 >/dev/null 2>&1 || command -v php-fpm5.6 >/dev/null 2>&1; then
          printf 'PHP_PRESENT=1\n';
          for candidate in php-cgi php-fpm php-fpm8.5 php-fpm8.4 php-fpm8.3 php-fpm8.2 php-fpm8.1 php-fpm8.0 php-fpm7.4 php-fpm7.3 php-fpm7.2 php-fpm7.1 php-fpm7.0 php-fpm5.6; do
            if command -v "$candidate" >/dev/null 2>&1; then "$candidate" -v 2>/dev/null | head -n 1; break; fi
          done
          printf 'UPLOAD_PROGRESS=UNKNOWN\n';
        else
          printf 'PHP_PRESENT=0\n';
        fi
  register: audit_docker_php_probes
  changed_when: false
  failed_when: false
  loop: "{{ audit_docker_containers.stdout_lines | default([]) }}"
  loop_control:
    label: "{{ item }}"
  when:
    - audit_scan_docker_containers | bool
    - audit_docker_containers.rc | default(1) == 0

- name: Normalize Docker container audit results
  ansible.builtin.set_fact:
    audit_container_results: "{{ audit_container_results | default([]) + [ {
      'runtime': 'docker',
      'runtime_id': item.item,
      'php_installed': ('PHP_PRESENT=1' in (item.stdout_lines | default([]))),
      'php_version': ((item.stdout_lines | default([]) | select('match', '^PHP ') | list | first) | default('not available')),
      'php_version_number': item.stdout_lines | default([]) | select('match', '^PHP [0-9]+\\.[0-9]+\\.[0-9]+') | list | first | default('') | regex_replace('^PHP ', '') | regex_replace(' .*$', ''),
      'php_ini_setting': ((item.stdout_lines | default([]) | select('match', '^UPLOAD_PROGRESS=') | list | first | default('UPLOAD_PROGRESS=UNKNOWN')) | regex_replace('^UPLOAD_PROGRESS=', '') | upper),
      'classification': ('NOT AFFECTED' if 'PHP_PRESENT=1' not in (item.stdout_lines | default([])) and item.rc | default(1) == 0 else ('POTENTIALLY VULNERABLE' if 'UPLOAD_PROGRESS=ON' in (item.stdout_lines | default([])) else ('MITIGATED' if 'UPLOAD_PROGRESS=OFF' in (item.stdout_lines | default([])) else 'NEEDS REVIEW'))),
      'probe_error': (item.stderr | default(''))
      } ] }}"
  loop: "{{ audit_docker_php_probes.results | default([]) }}"
  loop_control:
    label: "{{ item.item | default('unknown container') }}"
  when: item.item is defined

