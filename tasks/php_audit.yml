- name: Normalize classic LXC container audit results
  ansible.builtin.set_fact:
    audit_container_results: "{{ audit_container_results | default([]) + [ {
      'runtime': 'lxc',
      'runtime_id': item.item,
      'php_installed': ('PHP_PRESENT=1' in (item.stdout_lines | default([]))),
      'php_version': ((item.stdout_lines | default([]) | select('match', '^PHP ') | list | first) | default('not available')),
      'php_version_number': item.stdout_lines | default([]) | select('match', '^PHP [0-9]+\\.[0-9]+\\.[0-9]+') | list | first | default('') | regex_replace('^PHP ', '') | regex_replace(' .*$', ''),
      'php_ini_setting': ((item.stdout_lines | default([]) | select('match', '^UPLOAD_PROGRESS=') | list | first | default('UPLOAD_PROGRESS=UNKNOWN')) | regex_replace('^UPLOAD_PROGRESS=', '') | upper),
