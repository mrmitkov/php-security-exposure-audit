  loop_control:
    label: "{{ item.item | default('unknown Podman container') }}"
  when: item.item is defined

- name: List running classic LXC containers
  ansible.builtin.command:
    argv:
      - lxc-ls
      - --active
      - --line
  register: audit_lxc_classic_containers
  changed_when: false
  failed_when: false
  when: audit_scan_lxc_containers | bool

- name: Probe PHP inside each running classic LXC container
  ansible.builtin.command:
    argv:
      - lxc-attach
      - --name
      - "{{ item }}"
      - --
      - sh
      - -c
      - >-
        if command -v php >/dev/null 2>&1; then
          printf 'PHP_PRESENT=1\n';
