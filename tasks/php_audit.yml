    - item.split(',')[1] == 'RUNNING'

- name: Normalize LXD container audit results
  ansible.builtin.set_fact:
    audit_container_results: "{{ audit_container_results | default([]) + [ {
      'runtime': 'lxd',
      'runtime_id': item.item.split(',')[0],
      'php_installed': ('PHP_PRESENT=1' in (item.stdout_lines | default([]))),
      'php_version': ((item.stdout_lines | default([]) | select('match', '^PHP ') | list | first) | default('not available')),
      'php_version_number': item.stdout_lines | default([]) | select('match', '^PHP [0-9]+\\.[0-9]+\\.[0-9]+') | list | first | default('') | regex_replace('^PHP ', '') | regex_replace(' .*$', ''),
      'php_ini_setting': ((item.stdout_lines | default([]) | select('match', '^UPLOAD_PROGRESS=') | list | first | default('UPLOAD_PROGRESS=UNKNOWN')) | regex_replace('^UPLOAD_PROGRESS=', '') | upper),
      'classification': ('NOT AFFECTED' if 'PHP_PRESENT=1' not in (item.stdout_lines | default([])) and item.rc | default(1) == 0 else ('POTENTIALLY VULNERABLE' if 'UPLOAD_PROGRESS=ON' in (item.stdout_lines | default([])) else ('MITIGATED' if 'UPLOAD_PROGRESS=OFF' in (item.stdout_lines | default([])) else 'NEEDS REVIEW'))),
      'probe_error': (item.stderr | default(''))
      } ] }}"
  loop: "{{ audit_lxd_php_probes.results | default([]) }}"
  loop_control:
    label: "{{ item.item.split(',')[0] | default('unknown LXD container') }}"
  when: item.item is defined

- name: List Kubernetes pods and container names
  ansible.builtin.command:
    argv:
      - kubectl
      - get
      - pods
      - --all-namespaces
      - "-o=jsonpath={range .items[*]}{.metadata.namespace}{\"\\t\"}{.metadata.name}{\"\\t\"}{.status.phase}{\"\\t\"}{range .spec.containers[*]}{.name}{\",\"}{end}{\"\\n\"}{end}"
  register: audit_kubernetes_pods_raw
  changed_when: false
  failed_when: false
  become: false
  when: audit_scan_kubernetes_pods | bool

- name: Normalize Kubernetes pod inventory
  ansible.builtin.set_fact:
    audit_kubernetes_pods: "{{ audit_kubernetes_pods | default([]) + [ {
      'namespace': item.split('\t')[0],
      'name': item.split('\t')[1],
      'phase': item.split('\t')[2],
      'containers': (item.split('\t')[3].split(',') | reject('equalto', '') | list)
      } ] }}"
  loop: "{{ audit_kubernetes_pods_raw.stdout_lines | default([]) }}"
  loop_control:
    label: "{{ item.split('\t')[0] ~ '/' ~ item.split('\t')[1] }}"
  become: false
  when:
    - audit_scan_kubernetes_pods | bool
    - audit_kubernetes_pods_raw.rc | default(1) == 0
    - item.split('\t') | length >= 4

- name: Probe PHP inside each running Kubernetes pod container
  ansible.builtin.command:
    argv:
      - kubectl
      - exec
      - --namespace
      - "{{ item.0.namespace }}"
      - --container
      - "{{ item.1 }}"
      - "{{ item.0.name }}"
      - --
      - sh
      - -c
      - >-
        if command -v php >/dev/null 2>&1; then
          printf 'PHP_PRESENT=1\n';
          php -v 2>/dev/null | head -n 1;
          setting=$(php -r '$v = ini_get("session.upload_progress.enabled"); if ($v === false) { echo "UNKNOWN"; } else { echo in_array(strtolower((string) $v), array("1", "on", "yes", "true"), true) ? "ON" : "OFF"; }' 2>/dev/null) || setting=UNKNOWN;
          printf 'UPLOAD_PROGRESS=%s\n' "$setting";
        elif command -v php-cgi >/dev/null 2>&1 || command -v php-fpm >/dev/null 2>&1 || command -v php-fpm8.5 >/dev/null 2>&1 || command -v php-fpm8.4 >/dev/null 2>&1 || command -v php-fpm8.3 >/dev/null 2>&1 || command -v php-fpm8.2 >/dev/null 2>&1 || command -v php-fpm8.1 >/dev/null 2>&1 || command -v php-fpm8.0 >/dev/null 2>&1 || command -v php-fpm7.4 >/dev/null 2>&1 || command -v php-fpm7.3 >/dev/null 2>&1 || command -v php-fpm7.2 >/dev/null 2>&1 || command -v php-fpm7.1 >/dev/null 2>&1 || command -v php-fpm7.0 >/dev/null 2>&1 || command -v php-fpm5.6 >/dev/null 2>&1; then
          printf 'PHP_PRESENT=1\n';
          for candidate in php-cgi php-fpm php-fpm8.5 php-fpm8.4 php-fpm8.3 php-fpm8.2 php-fpm8.1 php-fpm8.0 php-fpm7.4 php-fpm7.3 php-fpm7.2 php-fpm7.1 php-fpm7.0 php-fpm5.6; do
            if command -v "$candidate" >/dev/null 2>&1; then "$candidate" -v 2>/dev/null | head -n 1; break; fi
          done
          printf 'UPLOAD_PROGRESS=UNKNOWN\n';
        else
          printf 'PHP_PRESENT=0\n';
        fi
  register: audit_kubernetes_php_probes
  changed_when: false
  failed_when: false
  loop: "{{ query('subelements', audit_kubernetes_pods | default([]), 'containers') }}"
  loop_control:
    label: "{{ item.0.namespace }}/{{ item.0.name }}/{{ item.1 }}"
  become: false
  when:
    - audit_scan_kubernetes_pods | bool
    - item.0.phase == 'Running'

- name: Normalize Kubernetes container audit results
  ansible.builtin.set_fact:
    audit_container_results: "{{ audit_container_results | default([]) + [ {
      'runtime': 'kubernetes',
      'runtime_id': item.item.0.namespace ~ '/' ~ item.item.0.name ~ '/' ~ item.item.1,
      'php_installed': ('PHP_PRESENT=1' in (item.stdout_lines | default([]))),
      'php_version': ((item.stdout_lines | default([]) | select('match', '^PHP ') | list | first) | default('not available')),
      'php_version_number': item.stdout_lines | default([]) | select('match', '^PHP [0-9]+\\.[0-9]+\\.[0-9]+') | list | first | default('') | regex_replace('^PHP ', '') | regex_replace(' .*$', ''),
      'php_ini_setting': ((item.stdout_lines | default([]) | select('match', '^UPLOAD_PROGRESS=') | list | first | default('UPLOAD_PROGRESS=UNKNOWN')) | regex_replace('^UPLOAD_PROGRESS=', '') | upper),
      'classification': ('NOT AFFECTED' if 'PHP_PRESENT=1' not in (item.stdout_lines | default([])) and item.rc | default(1) == 0 else ('POTENTIALLY VULNERABLE' if 'UPLOAD_PROGRESS=ON' in (item.stdout_lines | default([])) else ('MITIGATED' if 'UPLOAD_PROGRESS=OFF' in (item.stdout_lines | default([])) else 'NEEDS REVIEW'))),
      'probe_error': (item.stderr | default(''))
      } ] }}"
  loop: "{{ audit_kubernetes_php_probes.results | default([]) }}"
  loop_control:
    label: "{{ item.item.0.namespace | default('unknown') }}/{{ item.item.0.name | default('unknown') }}"
  when: item.item is defined

- name: Validate normalized container audit results
  ansible.builtin.assert:
    that:
      - item is mapping
    fail_msg: "Container audit result must be a mapping; runtime results cannot be classified."
  loop: "{{ audit_container_results | default([]) }}"
  loop_control:
    label: "{{ item.runtime | default('unknown runtime') if item is mapping else 'invalid container result' }}"

- name: Initialize fixed-version container results
  ansible.builtin.set_fact:
    audit_container_results_fixed: []

- name: Apply fixed PHP release classification to container results
  ansible.builtin.set_fact:
    audit_container_results_fixed: "{{ audit_container_results_fixed | default([]) + [item | combine({
      'php_version_fixed': ((item.php_version_number | default('')).split('.')[0:2] | join('.')) in audit_php_fixed_versions and ((item.php_version_number | default('')).split('.')[2] | int >= audit_php_fixed_versions[(item.php_version_number | default('')).split('.')[0:2] | join('.')].split('.')[2] | int),
      'classification': ('FIXED VERSION' if (((item.php_version_number | default('')).split('.')[0:2] | join('.')) in audit_php_fixed_versions and ((item.php_version_number | default('')).split('.')[2] | int >= audit_php_fixed_versions[(item.php_version_number | default('')).split('.')[0:2] | join('.')].split('.')[2] | int)) else item['classification'])
    })] }}"
  loop: "{{ audit_container_results | default([]) }}"

- name: Replace container audit results with fixed-version classifications
  ansible.builtin.set_fact:
    audit_container_results: "{{ audit_container_results_fixed | default([]) }}"

- name: Clear temporary fixed-version container results
  ansible.builtin.set_fact:
    audit_container_results_fixed: []

- name: Derive PHP installation evidence
  ansible.builtin.set_fact:
    audit_php_detected: "{{ (audit_php_binary.rc | default(1) == 0) or ((audit_php_sapi_binaries.stdout_lines | default([]) | length) > 0) or ((audit_packages.stdout_lines | default([]) | select('match', '(?i)^(php|libphp)') | list | length) > 0) }}"

- name: Derive PHP version and fixed release status
  ansible.builtin.set_fact:
    audit_php_version_number: "{{ (((audit_php_version.stdout_lines | default([]) | first) | default((audit_php_sapi_version.stdout_lines | default([]) | first) | default('', true), true)) | regex_replace('^PHP ', '') | regex_replace(' .*$', '') | regex_search('^[0-9]+\\.[0-9]+\\.[0-9]+')) | default('', true) }}"

- name: Determine whether the host PHP version is fixed
  ansible.builtin.set_fact:
    audit_php_version_fixed: "{{ (audit_php_version_number.split('.')[0:2] | join('.')) in audit_php_fixed_versions and (audit_php_version_number.split('.')[2] | int >= audit_php_fixed_versions[audit_php_version_number.split('.')[0:2] | join('.')].split('.')[2] | int) }}"

- name: Build normalized per-host audit result
  ansible.builtin.set_fact:
    php_audit:
      inventory_hostname: "{{ inventory_hostname }}"
      hostname: "{{ ansible_hostname | default(inventory_hostname) }}"
      fqdn: "{{ ansible_fqdn | default('unknown') }}"
      ip_addresses: "{{ ansible_all_ipv4_addresses | default([]) }}"
      primary_ip: "{{ ansible_default_ipv4.address | default((ansible_all_ipv4_addresses | default([]) | first) | default('unknown')) }}"
      operating_system: "{{ (ansible_distribution | default('unknown')) ~ ' ' ~ (ansible_distribution_version | default('')) }}"
      kernel: "{{ (ansible_kernel | default('unknown')) ~ ' ' ~ (ansible_kernel_version | default('')) }}"
      uptime_seconds: "{{ ansible_uptime_seconds | default(0) | int }}"
      php_installed: "{{ audit_php_detected }}"
      php_detection_status: "{{ 'detected' if audit_php_detected else ('not detected' if audit_packages.rc | default(1) == 0 else 'unknown: package discovery failed') }}"
      php_version: "{{ (audit_php_version.stdout_lines | default([]) | first) | default((audit_php_sapi_version.stdout_lines | default([]) | first) | default('not available', true), true) }}"
      php_version_number: "{{ audit_php_version_number }}"
      php_version_fixed: "{{ audit_php_version_fixed | bool }}"
      php_ini_setting_raw: "{{ audit_upload_progress.stdout | default('') | trim }}"
      php_ini_setting: "{{ (audit_upload_progress.stdout | default('UNKNOWN') | trim | upper) if (audit_upload_progress.stdout | default('UNKNOWN') | trim | upper) in ['ON', 'OFF'] else 'UNKNOWN' }}"
      php_ini_setting_error: "{{ audit_upload_progress.stderr | default('') }}"
      php_ini_scope: "CLI SAPI only; web SAPI configuration may differ"
      php_cgi_binaries: "{{ audit_php_sapi_binaries.stdout_lines | default([]) | select('search', '/php-cgi$') | list }}"
      php_fpm_binaries: "{{ audit_php_sapi_binaries.stdout_lines | default([]) | select('search', '/php-fpm') | list }}"
      php_cgi_installed: "{{ ((audit_php_sapi_binaries.stdout_lines | default([]) | select('search', '/php-cgi$') | list | length) > 0) or ((audit_packages.stdout_lines | default([]) | select('search', '(?i)php.*cgi') | list | length) > 0) }}"
      php_fpm_installed: "{{ ((audit_php_sapi_binaries.stdout_lines | default([]) | select('search', '/php-fpm') | list | length) > 0) or ((audit_packages.stdout_lines | default([]) | select('search', '(?i)php.*fpm') | list | length) > 0) }}"
      php_packages: "{{ audit_packages.stdout_lines | default([]) | select('match', '(?i)^(php|libphp)') | list }}"
      web_packages: "{{ audit_packages.stdout_lines | default([]) | select('match', '(?i)^(apache2|httpd|nginx|tomcat|websphere)') | list }}"
      apache_installed: "{{ ((audit_packages.stdout_lines | default([]) | select('match', '(?i)^(apache2|httpd)') | list | length) > 0) or ((audit_web_server_binaries.stdout_lines | default([]) | select('search', '/(apache2|httpd|apachectl|apache2ctl)$') | list | length) > 0) or ((audit_service_names | default([]) | select('match', '(?i)^(apache2|httpd)(\\.service)?$') | list | length) > 0) }}"
      apache_active: "{{ ((audit_running_service_names | default([]) | select('match', '(?i)^(apache2|httpd)(\\.service)?$') | list | length) > 0) or ('active:apache' in (audit_process_probe.stdout_lines | default([]))) }}"
      nginx_installed: "{{ ((audit_packages.stdout_lines | default([]) | select('match', '(?i)^nginx') | list | length) > 0) or ((audit_web_server_binaries.stdout_lines | default([]) | select('search', '/nginx$') | list | length) > 0) or ((audit_service_names | default([]) | select('match', '(?i)^nginx(\\.service)?$') | list | length) > 0) }}"
      nginx_active: "{{ ((audit_running_service_names | default([]) | select('match', '(?i)^nginx(\\.service)?$') | list | length) > 0) or ('active:nginx' in (audit_process_probe.stdout_lines | default([]))) }}"
      tomcat_installed: "{{ ((audit_packages.stdout_lines | default([]) | select('match', '(?i)^tomcat') | list | length) > 0) or ((audit_service_names | default([]) | select('match', '(?i)^tomcat[0-9]*(\\.service)?$') | list | length) > 0) or ((audit_tomcat_paths.stdout_lines | default([]) | length) > 0) }}"
      tomcat_active: "{{ ((audit_running_service_names | default([]) | select('match', '(?i)^tomcat[0-9]*(\\.service)?$') | list | length) > 0) or ('active:tomcat' in (audit_process_probe.stdout_lines | default([]))) }}"
      websphere_installed: "{{ ((audit_packages.stdout_lines | default([]) | select('match', '(?i)^websphere') | list | length) > 0) or ((audit_websphere_paths.stdout_lines | default([]) | length) > 0) or ((audit_service_names | default([]) | select('match', '(?i)^(websphere|ibm-websphere)(\\.service)?$') | list | length) > 0) }}"
      websphere_active: "{{ ((audit_running_service_names | default([]) | select('match', '(?i)^(websphere|ibm-websphere)(\\.service)?$') | list | length) > 0) or ('active:websphere' in (audit_process_probe.stdout_lines | default([]))) }}"
      websphere_paths: "{{ audit_websphere_paths.stdout_lines | default([]) }}"
      listening_tcp_ports: "{{ audit_listening_ports.stdout_lines | default([]) | map('int') | list }}"
      php_file_count: "{{ audit_php_file_count.stdout | default('0') | trim | int }}"
      php_directories: "{{ audit_php_directories.stdout_lines | default([]) }}"
      war_file_count: "{{ audit_war_count.stdout | default('0') | trim | int }}"
      war_deployment_directories: "{{ audit_war_directories.stdout_lines | default([]) }}"
      document_roots_found: "{{ audit_document_roots_found.stdout_lines | default([]) }}"
      container_results: "{{ audit_container_results | default([]) }}"
      docker_running_container_count: "{{ audit_docker_containers.stdout_lines | default([]) | length }}"
      podman_running_container_count: "{{ audit_podman_containers.stdout_lines | default([]) | length }}"
      lxc_classic_running_container_count: "{{ audit_lxc_classic_containers.stdout_lines | default([]) | length }}"
      lxd_running_container_count: "{{ (audit_lxd_containers.stdout_lines | default([]) | select('search', ',RUNNING$') | list | length) }}"
      kubernetes_pod_count: "{{ audit_kubernetes_pods | default([]) | length }}"
      lxc_classic_scan_status: "{{ 'disabled' if not (audit_scan_lxc_containers | bool) else ('completed' if audit_lxc_classic_containers.rc | default(1) == 0 else 'unavailable or access denied') }}"
      lxd_scan_status: "{{ 'disabled' if not (audit_scan_lxc_containers | bool) else ('completed' if audit_lxd_containers.rc | default(1) == 0 else 'unavailable or access denied') }}"
      docker_scan_status: "{{ 'disabled' if not (audit_scan_docker_containers | bool) else ('completed' if audit_docker_containers.rc | default(1) == 0 else 'failed: ' ~ (audit_docker_containers.stderr | default('runtime unavailable'))) }}"
      podman_scan_status: "{{ 'disabled' if not (audit_scan_podman_containers | bool) else ('completed' if audit_podman_containers.rc | default(1) == 0 else 'failed: ' ~ (audit_podman_containers.stderr | default('runtime unavailable'))) }}"
      kubernetes_scan_status: "{{ 'disabled' if not (audit_scan_kubernetes_pods | bool) else ('completed' if audit_kubernetes_pods_raw.rc | default(1) == 0 else 'failed: ' ~ (audit_kubernetes_pods_raw.stderr | default('kubectl unavailable or access denied'))) }}"
      php_setting_collection_rc: "{{ audit_upload_progress.rc | default(-1) | int }}"
      package_discovery_error: "{{ audit_packages.stderr | default('') }}"
      classification: "{{ 'NEEDS REVIEW' if not audit_php_detected and audit_packages.rc | default(1) != 0 else ('NOT AFFECTED' if not audit_php_detected else ('FIXED VERSION' if audit_php_version_fixed | bool else ('POTENTIALLY VULNERABLE' if ((audit_upload_progress.rc | default(1) == 0) and (audit_upload_progress.stdout | default('UNKNOWN') | trim | upper) == 'ON') else ('MITIGATED' if ((audit_upload_progress.rc | default(1) == 0) and (audit_upload_progress.stdout | default('UNKNOWN') | trim | upper) == 'OFF') else 'NEEDS REVIEW')))) }}"
