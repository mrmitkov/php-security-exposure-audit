---
audit_output_dir: "{{ playbook_dir }}/reports"
audit_generate_pdf: true
audit_scan_docker_containers: true
audit_scan_podman_containers: true
audit_scan_kubernetes_pods: true
audit_scan_lxc_containers: true
audit_php_scan_roots:
  - /usr
  - /home
  - /var/www
  - /srv
  - /opt
audit_war_scan_roots:
  - /opt
  - /var/lib
  - /usr/share
  - /srv
  - /home
audit_document_roots:
  - /usr
  - /usr/local
  - /home
  - /var/www
  - /srv/www
  - /srv
  - /opt
  - /usr/share/nginx/html
